

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHECK | Leitor QR Code</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 22px; background: #0f172a;
      color: white; font: 15px Arial, sans-serif;
    }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: 26px; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-top: 16px; }
    video { width: 100%; max-height: 440px; background: #020617; border-radius: 12px; }
    #status { background: #334155; padding: 14px; border-radius: 9px; margin: 14px 0; overflow-wrap: anywhere; }
    .ok { background: #166534 !important; }
    .err { background: #991b1b !important; }
    .warn { background: #92400e !important; }
    button { border: 0; border-radius: 9px; padding: 13px 18px; margin: 4px; font-weight: bold; cursor: pointer; }
    .start { background: #dc2626; color: white; }
    .stop { background: #cbd5e1; color: #0f172a; }
    .field { margin: 10px 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>CHECK | Leitor QR Code</h1>
  <p>Permita o acesso à câmera e mantenha o QR Code dentro do enquadramento.</p>

  <section class="card">
    <video id="video" muted playsinline></video>
    <div id="status">Preparando leitor...</div>
    <button class="start" id="iniciar">INICIAR CÂMERA</button>
    <button class="stop" id="parar">PARAR CÂMERA</button>
  </section>

  <section class="card">
    <h3>Resultado</h3>
    <div class="field">OPS ID: <strong id="ops">—</strong></div>
    <div class="field">Colaborador: <strong id="colaborador">—</strong></div>
    <div class="field">Líder: <strong id="lider">—</strong></div>
    <div class="field">Turno: <strong id="turno">—</strong></div>
    <div class="field">Registro: <strong id="registro">Aguardando leitura</strong></div>
    <button class="stop" id="retomar">LER OUTRO QR CODE</button>
  </section>
</main>

<script>
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  let leitor = null;
  let controles = null;
  let lendo = false;
  let aguardando = false;
  let ultimoTexto = '';

  function status(texto, classe) {
    statusEl.textContent = texto;
    statusEl.className = classe || '';
  }

  async function iniciarCamera() {
    pararCamera();
    if (!window.isSecureContext) {
      status('A página não está em contexto seguro. Abra pelo HTTPS do GitHub Pages.', 'err');
      return;
    }
    if (!window.ZXingBrowser || !ZXingBrowser.BrowserQRCodeReader) {
      status('A biblioteca de leitura não carregou. Atualize a página e tente novamente.', 'err');
      return;
    }

    status('Solicitando acesso à câmera...', 'warn');
    try {
      leitor = new ZXingBrowser.BrowserQRCodeReader();
      controles = await leitor.decodeFromVideoDevice(
        undefined, video,
        (resultado, erro) => {
          if (!resultado || lendo || aguardando) return;

          const texto = resultado.getText().trim();
          if (!texto) return;

          lendo = true;
          aguardando = true;
          ultimoTexto = texto;
          document.getElementById('ops').textContent = texto;
          document.getElementById('registro').textContent = 'Enviando ao painel...';
          status('QR LIDO: ' + texto + '. Enviando ao painel CHECK...', 'warn');

          if (!window.opener || window.opener.closed) {
            status('QR lido, mas o painel não foi encontrado. Feche esta janela e abra o leitor pelo botão do painel Apps Script.', 'err');
            document.getElementById('registro').textContent = 'Painel não conectado';
            aguardando = false;
            lendo = false;
            return;
          }

          window.opener.postMessage({ type: 'QR_SCAN', opsId: texto }, '*');

          setTimeout(() => {
            if (aguardando) {
              status('QR enviado, mas o painel ainda não respondeu. Verifique se o painel está aberto e atualizado.', 'err');
              document.getElementById('registro').textContent = 'Sem resposta do painel';
              aguardando = false;
              lendo = false;
            }
          }, 15000);
        }
      );
      status('Câmera ativa. Aponte para o QR Code.', 'ok');
    } catch (e) {
      status('Não foi possível abrir a câmera: ' + (e.message || e), 'err');
    }
  }

  function pararCamera() {
    if (controles && controles.stop) {
      try { controles.stop(); } catch (e) {}
    }
    controles = null;
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
  }

  function limparParaNovaLeitura() {
    aguardando = false;
    lendo = false;
    ultimoTexto = '';
    document.getElementById('ops').textContent = '—';
    document.getElementById('colaborador').textContent = '—';
    document.getElementById('lider').textContent = '—';
    document.getElementById('turno').textContent = '—';
    document.getElementById('registro').textContent = 'Aguardando leitura';
    status('Pronto para ler outro QR Code.', 'warn');
  }

  window.addEventListener('message', event => {
    if (event.source !== window.opener) return;
    if (!event.data || event.data.type !== 'SCAN_RESULT') return;

    const r = event.data.resultado || {};
    aguardando = false;
    lendo = false;

    document.getElementById('ops').textContent = r.opsId || ultimoTexto || '—';
    document.getElementById('colaborador').textContent = r.colaborador || '—';
    document.getElementById('lider').textContent = r.lider || '—';
    document.getElementById('turno').textContent = r.turno || '—';
    document.getElementById('registro').textContent = r.mensagem || 'Consulta concluída';

    if (r.sucesso) status(r.mensagem || 'Registro realizado!', 'ok');
    else if (r.duplicado) status(r.mensagem || 'Este código já foi registrado hoje.', 'warn');
    else status(r.mensagem || 'OPS ID não encontrado.', 'err');
  });

  document.getElementById('iniciar').addEventListener('click', iniciarCamera);
  document.getElementById('parar').addEventListener('click', pararCamera);
  document.getElementById('retomar').addEventListener('click', limparParaNovaLeitura);

  window.addEventListener('beforeunload', pararCamera);
  status('Clique em INICIAR CÂMERA para começar.', 'warn');
</script>
</body>
</html>

</script>
</body>
</html>
