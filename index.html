


<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHECK - Scanner de Crachá</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: clamp(24px, 4vw, 34px); }

    #cameraArea {
      position: relative;
      width: min(700px, 96vw);
      margin: 24px auto;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 220px;
      max-height: 65vh;
      object-fit: cover;
    }

    .mira {
      position: absolute;
      width: min(78%, 380px);
      height: 180px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid white;
      border-radius: 8px;
      pointer-events: none;
    }

    .painel {
      width: min(700px, 96vw);
      margin: 16px auto;
      padding: 16px;
      border-radius: 12px;
      background: #272d38;
      overflow-wrap: anywhere;
    }

    #status {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }

    #resultado {
      display: none;
      background: #1f2937;
      border: 2px solid #16a34a;
      text-align: left;
    }

    .campo {
      margin-top: 12px;
      padding: 14px;
      background: #111827;
      border-radius: 8px;
    }

    .rotulo {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    button {
      margin: 10px 5px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #retomar { background: #15803d; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <h1>📷 CHECK - Scanner de Crachá</h1>
  <p>Posicione o QR Code dentro do retângulo e mantenha o crachá estável.</p>

  <div id="cameraArea">
    <video id="video" autoplay muted playsinline></video>
    <div class="mira"></div>
  </div>

  <div id="status" class="painel" role="status" aria-live="polite">
    Iniciando leitor...
  </div>

  <section id="resultado" class="painel">
    <h2>✅ Colaborador identificado</h2>

    <div class="campo">
      <span class="rotulo">COLABORADOR</span>
      <span id="nome" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">LÍDER RESPONSÁVEL</span>
      <span id="lider" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">TURNO</span>
      <span id="turno" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">OPS ID</span>
      <span id="opsId" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">ABA DE ORIGEM</span>
      <span id="aba" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">STATUS DO REGISTRO</span>
      <span id="registro" class="valor">—</span>
    </div>
  </section>

  <button id="retomar" hidden onclick="retomarLeitura()">
    📷 LER PRÓXIMO CRACHÁ
  </button>

<script>
  const WEB_APP_URL =
    'https://script.google.com/a/macros/shopee.com/s/AKfycbyejcjWciAHcVV1U0vXDp8DA5vvSVGXIKjvaaJ2zioLa9y_rWiO4quwLx5ot_3f2LK3Yw/exec';

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const resultadoEl = document.getElementById('resultado');
  const botaoRetomar = document.getElementById('retomar');

  let leitor = null;
  let controles = null;
  let lendo = true;
  let aguardandoResposta = false;
  let scannerIniciado = false;
  let requisicaoAtual = null;

  function status(texto) {
    statusEl.textContent = texto;
  }

  function limparResultado() {
    resultadoEl.style.display = 'none';

    ['nome', 'lider', 'turno', 'opsId', 'aba', 'registro']
      .forEach(function(id) {
        document.getElementById(id).textContent = '—';
      });
  }

  function consultarPlanilha(opsId) {
    status('🔎 QR lido: ' + opsId + '. Consultando planilha...');
    botaoRetomar.hidden = true;

    const nomeCallback =
      'checkCallback_' + Date.now() + '_' +
      Math.floor(Math.random() * 1000000);

    let script = document.createElement('script');
    let finalizado = false;
    let timeoutId;

    function finalizar() {
      if (finalizado) return;
      finalizado = true;

      clearTimeout(timeoutId);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[nomeCallback];
      } catch (e) {
        window[nomeCallback] = undefined;
      }

      if (requisicaoAtual && requisicaoAtual.finalizar === finalizar) {
        requisicaoAtual = null;
      }
    }

    window[nomeCallback] = function(resultado) {
      if (finalizado) return;

      finalizar();

      if (!resultado) {
        status('❌ A planilha retornou uma resposta vazia.');
        aguardandoResposta = false;
        botaoRetomar.hidden = false;
        return;
      }

      if (!resultado.encontrado) {
        limparResultado();

        status('❌ ' + (
          resultado.mensagem ||
          'OPS ID não encontrado nas abas de turno.'
        ));

        aguardandoResposta = false;
        botaoRetomar.hidden = false;
        return;
      }

      document.getElementById('nome').textContent =
        resultado.colaborador || 'Não informado';

      document.getElementById('lider').textContent =
        resultado.lider || 'Não informado';

      document.getElementById('turno').textContent =
        resultado.turno || 'Não informado';

      document.getElementById('opsId').textContent =
        resultado.opsId || opsId;

      document.getElementById('aba').textContent =
        resultado.aba || 'Não informada';

      document.getElementById('registro').textContent =
        resultado.sucesso ? 'REGISTRADO NA ABA CHECK' :
        resultado.duplicado ? 'JÁ REGISTRADO HOJE' :
        (resultado.mensagem || 'CONSULTADO');

      resultadoEl.style.display = 'block';

      if (resultado.sucesso) {
        status('✅ Colaborador identificado e registrado!');
      } else if (resultado.duplicado) {
        status('⚠️ Colaborador identificado; já registrado hoje.');
      } else {
        status('✅ Colaborador identificado.');
      }

      aguardandoResposta = false;
      lendo = false;
      botaoRetomar.hidden = false;
    };

    script.onerror = function() {
      if (finalizado) return;
      finalizar();

      status(
        '❌ Não foi possível acessar o Web App. ' +
        'Verifique a implantação e as permissões de acesso.'
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
    };

    const parametros = new URLSearchParams({
      api: 'scan',
      opsId: opsId,
      callback: nomeCallback,
      _: String(Date.now())
    });

    script.src = WEB_APP_URL + '?' + parametros.toString();

    requisicaoAtual = { finalizar: finalizar };

    timeoutId = setTimeout(function() {
      if (finalizado) return;
      finalizar();

      status(
        '⏳ Tempo esgotado ao consultar a planilha. ' +
        'Verifique o acesso ao Web App e tente novamente.'
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
    }, 20000);

    document.body.appendChild(script);
  }

  async function iniciarScanner() {
    if (scannerIniciado) return;
    scannerIniciado = true;

    try {
      if (typeof ZXingBrowser === 'undefined') {
        throw new Error(
          'Biblioteca QR não carregada. Verifique a internet e recarregue.'
        );
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error('A câmera não está disponível neste navegador.');
      }

      leitor = new ZXingBrowser.BrowserQRCodeReader();

      status('📷 Solicitando acesso à câmera...');

      controles = await leitor.decodeFromVideoDevice(
        undefined,
        video,
        function(codigo, erro) {
          if (!codigo || !lendo || aguardandoResposta) return;

          const valor = String(codigo.getText() || '').trim();
          if (!valor) return;

          lendo = false;
          aguardandoResposta = true;

          consultarPlanilha(valor);
        }
      );

      status('🟢 CÂMERA ATIVA — Aponte o QR Code para a mira.');

    } catch (erro) {
      console.error(erro);
      scannerIniciado = false;

      status('❌ Erro ao iniciar leitor: ' + (erro.message || erro));
    }
  }

  function retomarLeitura() {
    if (requisicaoAtual) {
      requisicaoAtual.finalizar();
      requisicaoAtual = null;
    }

    limparResultado();
    aguardandoResposta = false;
    lendo = true;
    botaoRetomar.hidden = true;

    status('🟢 Pronto para ler o próximo crachá.');
  }

  window.addEventListener('beforeunload', function() {
    if (requisicaoAtual) {
      requisicaoAtual.finalizar();
    }

    if (controles && typeof controles.stop === 'function') {
      controles.stop();
    }
  });

  iniciarScanner();
</script>
</body>
</html>
