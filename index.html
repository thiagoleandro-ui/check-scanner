
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHECK - Scanner de Crachá</title>

  <!-- Biblioteca ZXing para leitura de QR Code -->
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #111827;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: clamp(24px, 4vw, 34px);
    }

    .subtitulo {
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    #cameraArea {
      position: relative;
      width: min(700px, 96vw);
      margin: 22px auto;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 240px;
      max-height: 70vh;
      object-fit: contain;
      background: #000;
    }

    .mira {
      position: absolute;
      width: min(78%, 380px);
      height: 180px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #fff;
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.08);
    }

    .painel {
      width: min(700px, 96vw);
      margin: 16px auto;
      padding: 16px;
      border-radius: 12px;
      background: #272d38;
      overflow-wrap: anywhere;
    }

    #status {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }

    #resultado {
      display: none;
      background: #1f2937;
      border: 2px solid #16a34a;
      text-align: left;
    }

    .campo {
      margin-top: 12px;
      padding: 14px;
      background: #111827;
      border-radius: 8px;
    }

    .rotulo {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 6px;
      letter-spacing: .4px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    button {
      margin: 10px 5px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #retomar {
      background: #15803d;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <h1>📷 CHECK - Scanner de Crachá</h1>

  <p class="subtitulo">
    Posicione o QR Code dentro do retângulo e mantenha o crachá estável.
  </p>

  <div id="cameraArea">
    <video id="video" autoplay muted playsinline></video>
    <div class="mira"></div>
  </div>

  <div id="status" class="painel" role="status" aria-live="polite">
    Preparando leitor QR...
  </div>

  <section id="resultado" class="painel">
    <h2>✅ Resultado da leitura</h2>

    <div class="campo">
      <span class="rotulo">COLABORADOR</span>
      <span id="nome" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">LÍDER RESPONSÁVEL</span>
      <span id="lider" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">TURNO</span>
      <span id="turno" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">OPS ID</span>
      <span id="opsId" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">ABA DE ORIGEM</span>
      <span id="aba" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">STATUS DO REGISTRO</span>
      <span id="registro" class="valor">—</span>
    </div>
  </section>

  <button id="retomar" hidden onclick="retomarLeitura()">
    📷 LER PRÓXIMO CRACHÁ
  </button>

<script>
  // URL do Web App fornecida para o projeto CHECK.
  const WEB_APP_URL =
    'https://script.google.com/a/macros/shopee.com/s/AKfycbyejcjWciAHcVV1U0vXDp8DA5vvSVGXIKjvaaJ2zioLa9y_rWiO4quwLx5ot_3f2LK3Yw/exec';

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const resultadoEl = document.getElementById('resultado');
  const botaoRetomar = document.getElementById('retomar');

  let leitor = null;
  let controles = null;
  let scannerIniciado = false;
  let lendo = true;
  let aguardandoResposta = false;
  let requisicaoAtual = null;

  function mostrarStatus(mensagem) {
    statusEl.textContent = mensagem;
  }

  function limparResultado() {
    resultadoEl.style.display = 'none';

    [
      'nome',
      'lider',
      'turno',
      'opsId',
      'aba',
      'registro'
    ].forEach(function(id) {
      document.getElementById(id).textContent = '—';
    });
  }

  // Recebe o conteúdo real decodificado pelo QR Code.
  function aoLerQRCode(texto) {
    if (!lendo || aguardandoResposta) return;

    const valor = String(texto || '').trim();

    if (!valor) return;

    lendo = false;
    aguardandoResposta = true;
    botaoRetomar.hidden = true;

    console.log('[CHECK] QR decodificado:', valor);

    // Confirma visualmente que a câmera leu o código.
    mostrarStatus('✅ QR LIDO: ' + valor + ' — consultando planilha...');

    consultarPlanilha(valor);
  }

  // Consulta o Apps Script sem depender de window.opener.
  function consultarPlanilha(opsId) {
    const callbackNome =
      'checkCallback_' +
      Date.now() + '_' +
      Math.floor(Math.random() * 1000000);

    let script = document.createElement('script');
    let finalizado = false;
    let timeoutId;

    function finalizar() {
      if (finalizado) return;
      finalizado = true;

      clearTimeout(timeoutId);

      script.onerror = null;

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackNome];
      } catch (erro) {
        window[callbackNome] = undefined;
      }

      if (
        requisicaoAtual &&
        requisicaoAtual.finalizar === finalizar
      ) {
        requisicaoAtual = null;
      }
    }

    window[callbackNome] = function(resultado) {
      if (finalizado) return;

      finalizar();

      if (!resultado) {
        mostrarStatus(
          '❌ A consulta foi concluída, mas a resposta está vazia.'
        );
        aguardandoResposta = false;
        botaoRetomar.hidden = false;
        return;
      }

      console.log('[CHECK] Resposta do Apps Script:', resultado);

      if (!resultado.encontrado) {
        limparResultado();

        mostrarStatus(
          '❌ ' +
          (resultado.mensagem || 'OPS ID não encontrado nas abas de turno.')
        );

        aguardandoResposta = false;
        botaoRetomar.hidden = false;
        return;
      }

      document.getElementById('nome').textContent =
        resultado.colaborador || 'Não informado';

      document.getElementById('lider').textContent =
        resultado.lider || 'Não informado';

      document.getElementById('turno').textContent =
        resultado.turno || 'Não informado';

      document.getElementById('opsId').textContent =
        resultado.opsId || opsId;

      document.getElementById('aba').textContent =
        resultado.aba || 'Não informada';

      document.getElementById('registro').textContent =
        resultado.sucesso
          ? 'REGISTRADO NA ABA CHECK'
          : resultado.duplicado
            ? 'JÁ REGISTRADO HOJE'
            : (resultado.mensagem || 'CONSULTADO');

      resultadoEl.style.display = 'block';

      if (resultado.sucesso) {
        mostrarStatus('✅ Colaborador identificado e registrado!');
      } else if (resultado.duplicado) {
        mostrarStatus('⚠️ Colaborador identificado; já registrado hoje.');
      } else {
        mostrarStatus('✅ Colaborador identificado.');
      }

      aguardandoResposta = false;
      lendo = false;
      botaoRetomar.hidden = false;
    };

    script.onerror = function() {
      if (finalizado) return;

      finalizar();

      mostrarStatus(
        '❌ Não foi possível acessar o Web App. ' +
        'Verifique a implantação e as permissões de acesso.'
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
    };

    const parametros = new URLSearchParams({
      api: 'scan',
      opsId: opsId,
      callback: callbackNome,
      _: String(Date.now())
    });

    script.src = WEB_APP_URL + '?' + parametros.toString();

    requisicaoAtual = { finalizar: finalizar };

    timeoutId = setTimeout(function() {
      if (finalizado) return;

      finalizar();

      mostrarStatus(
        '⏳ A consulta demorou demais. Verifique o acesso ao Web App.'
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
    }, 20000);

    document.body.appendChild(script);
  }

  async function iniciarScanner() {
    if (scannerIniciado) return;

    scannerIniciado = true;

    try {
      if (typeof ZXingBrowser === 'undefined') {
        throw new Error(
          'Biblioteca QR não carregada. Verifique a internet e recarregue a página.'
        );
      }

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        throw new Error(
          'Câmera indisponível. Abra o scanner pelo endereço HTTPS.'
        );
      }

      // Leitor específico de QR Code, usado na versão que já decodificou OPS.
      leitor = new ZXingBrowser.BrowserQRCodeReader();

      mostrarStatus('📷 Solicitando acesso à câmera...');

      // Mantém o método de leitura anterior, sem depender da janela pai.
      controles = await leitor.decodeFromVideoDevice(
        undefined,
        video,
        function(codigo, erro) {
          if (codigo) {
            aoLerQRCode(codigo.getText());
            return;
          }

          // Erros de decodificação por quadro são comuns enquanto
          // a câmera ainda não encontra um QR válido.
          if (erro && !lendo && !aguardandoResposta) {
            console.debug('[CHECK] Leitura:', erro.message || erro);
          }
        }
      );

      mostrarStatus(
        '🟢 CÂMERA ATIVA — Aponte o QR Code para dentro da mira.'
      );

    } catch (erro) {
      console.error('[CHECK] Erro ao iniciar leitor:', erro);

      scannerIniciado = false;

      mostrarStatus(
        '❌ Erro ao iniciar leitor: ' +
        (erro.message || String(erro))
      );
    }
  }

  function retomarLeitura() {
    if (requisicaoAtual) {
      requisicaoAtual.finalizar();
      requisicaoAtual = null;
    }

    limparResultado();

    aguardandoResposta = false;
    lendo = true;
    botaoRetomar.hidden = true;

    mostrarStatus(
      '🟢 Pronto para ler o próximo crachá. Posicione o QR dentro da mira.'
    );
  }

  window.addEventListener('beforeunload', function() {
    if (requisicaoAtual) {
      requisicaoAtual.finalizar();
    }

    if (controles && typeof controles.stop === 'function') {
      controles.stop();
    }
  });

  iniciarScanner();
</script>
</body>
</html>
