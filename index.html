<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CHECK - Scanner de Crachá</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 18px;
      font-size: 34px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 25px;
    }

    #camera {
      width: min(650px, 90vw);
      height: auto;
      border-radius: 18px;
      display: block;
      margin: auto;
      background: black;
    }

    #canvas {
      display: none;
    }

    .area {
      position: relative;
      width: min(650px, 90vw);
      margin: auto;
    }

    .mira {
      position: absolute;
      width: 280px;
      height: 280px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border: 5px solid white;
      border-radius: 5px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.35);
    }

    #status {
      width: min(650px, 90vw);
      margin: 25px auto;
      padding: 18px;
      border-radius: 12px;
      background: #374151;
      font-size: 20px;
      font-weight: bold;
    }

    .sucesso {
      background: #166534 !important;
    }

    .erro {
      background: #991b1b !important;
    }

    .info {
      background: #374151 !important;
    }
  </style>
</head>

<body>

  <h1>📷 CHECK - Scanner de Crachá</h1>

  <div class="subtitulo">
    Aponte o QR Code do crachá para a câmera
  </div>

  <div class="area">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

    <div class="mira"></div>

  </div>

  <canvas id="canvas"></canvas>

  <div id="status" class="info">
    🔄 Iniciando câmera...
  </div>


<script>

const APPS_SCRIPT_ORIGIN =
  'https://script.google.com';

const video =
  document.getElementById('camera');

const canvas =
  document.getElementById('canvas');

const ctx =
  canvas.getContext('2d', {
    willReadFrequently: true
  });

const status =
  document.getElementById('status');

let stream = null;
let lendo = true;


/* ==============================
   STATUS
============================== */

function mostrarStatus(texto, classe) {

  status.textContent = texto;

  status.className = '';

  status.classList.add(classe);

}


/* ==============================
   INICIAR CÂMERA
============================== */

async function iniciarCamera() {

  try {

    mostrarStatus(
      '📷 Solicitando acesso à câmera...',
      'info'
    );

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    mostrarStatus(
      '🟢 CÂMERA ATIVA — Aponte o QR Code para o quadrado.',
      'info'
    );


    requestAnimationFrame(lerQR);


  } catch (erro) {

    console.error(erro);

    mostrarStatus(
      '❌ ERRO AO ABRIR A CÂMERA: ' +
      erro.message,
      'erro'
    );

  }

}


/* ==============================
   LER QR CODE
============================== */

function lerQR() {

  if (!lendo) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imagem =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const codigo =
      jsQR(
        imagem.data,
        imagem.width,
        imagem.height,
        {
          inversionAttempts:
            'attemptBoth'
        }
      );


    if (codigo) {

      console.log(
        'QR ENCONTRADO:',
        codigo.data
      );


      processarQR(
        codigo.data
      );

      return;
    }

  }


  requestAnimationFrame(lerQR);

}


/* ==============================
   PROCESSAR QR
============================== */

function processarQR(valor) {

  lendo = false;


  const opsId =
    String(valor)
      .trim();


  mostrarStatus(
    '🟢 QR CODE LIDO: ' + opsId,
    'sucesso'
  );


  console.log(
    'OPS ID:',
    opsId
  );


  enviarParaAppsScript(
    opsId
  );

}


/* ==============================
   ENVIAR PARA APPS SCRIPT
============================== */

function enviarParaAppsScript(opsId) {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: 'QR_SCAN',
        opsId: opsId
      },

      APPS_SCRIPT_ORIGIN

    );


    mostrarStatus(
      '✅ QR LIDO: ' +
      opsId +
      ' — Enviado ao CHECK.',
      'sucesso'
    );


  } else {

    mostrarStatus(
      '⚠️ Scanner aberto diretamente. Abra pelo botão do painel CHECK.',
      'erro'
    );

    lendo = true;

    requestAnimationFrame(lerQR);

  }

}


/* ==============================
   INICIAR
============================== */

window.addEventListener(
  'load',
  iniciarCamera
);

</script>

</body>
</html>
