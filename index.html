
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHECK — Scanner de Crachá</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #111827;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 { font-size: clamp(24px, 4vw, 34px); }

    .subtitulo {
      color: #cbd5e1;
      line-height: 1.5;
    }

    #cameraArea {
      position: relative;
      width: min(700px, 96vw);
      margin: 22px auto;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 240px;
      max-height: 70vh;
      object-fit: contain;
      background: #000;
    }

    .mira {
      position: absolute;
      width: min(78%, 380px);
      height: 180px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #fff;
      border-radius: 8px;
      pointer-events: none;
    }

    .painel {
      width: min(700px, 96vw);
      margin: 16px auto;
      padding: 16px;
      border-radius: 12px;
      background: #272d38;
      overflow-wrap: anywhere;
    }

    #status {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.5;
    }

    #resultado {
      display: none;
      background: #1f2937;
      border: 2px solid #16a34a;
      text-align: left;
    }

    .campo {
      margin-top: 12px;
      padding: 14px;
      background: #111827;
      border-radius: 8px;
    }

    .rotulo {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 6px;
      letter-spacing: .4px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    button {
      margin: 10px 5px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #retomar { background: #15803d; }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <h1>📷 CHECK — Scanner de Crachá</h1>

  <p class="subtitulo">
    Posicione o QR Code dentro da mira e mantenha o crachá estável.
  </p>

  <div id="cameraArea">
    <video id="video" autoplay muted playsinline></video>
    <div class="mira"></div>
  </div>

  <div id="status" class="painel" role="status" aria-live="polite">
    Preparando leitor QR...
  </div>

  <section id="resultado" class="painel">
    <h2>✅ Colaborador identificado</h2>

    <div class="campo">
      <span class="rotulo">COLABORADOR</span>
      <span id="nome" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">LÍDER RESPONSÁVEL</span>
      <span id="lider" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">TURNO</span>
      <span id="turno" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">OPS ID</span>
      <span id="opsId" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">ABA DE ORIGEM</span>
      <span id="aba" class="valor">—</span>
    </div>

    <div class="campo">
      <span class="rotulo">STATUS DO REGISTRO</span>
      <span id="registro" class="valor">—</span>
    </div>
  </section>

  <button id="retomar" hidden onclick="retomarLeitura()">
    📷 LER PRÓXIMO CRACHÁ
  </button>

<script>
  // O painel Apps Script deve estar aberto antes de iniciar uma leitura.
  const APPS_SCRIPT_ORIGIN = 'https://script.google.com';
  const SCANNER_ORIGIN = 'https://thiagoleandro-ui.github.io';

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const resultadoEl = document.getElementById('resultado');
  const botaoRetomar = document.getElementById('retomar');

  let leitor = null;
  let controles = null;
  let scannerIniciado = false;
  let lendo = true;
  let aguardandoResposta = false;
  let ultimoOpsId = '';

  function mostrarStatus(mensagem) {
    statusEl.textContent = mensagem;
  }

  function limparResultado() {
    resultadoEl.style.display = 'none';

    [
      'nome', 'lider', 'turno', 'opsId', 'aba', 'registro'
    ].forEach(function(id) {
      document.getElementById(id).textContent = '—';
    });
  }

  // Recebe o conteúdo decodificado pelo leitor.
  function aoLerQRCode(texto) {
    if (!lendo || aguardandoResposta) return;

    const valor = String(texto || '').trim();
    if (!valor) return;

    ultimoOpsId = valor;
    lendo = false;
    aguardandoResposta = true;
    botaoRetomar.hidden = true;

    mostrarStatus('✅ QR LIDO: ' + valor + '. Enviando ao painel CHECK...');

    enviarCodigo(valor);
  }

  // Envia o OPS ID ao painel Apps Script, sem chamar o Web App diretamente.
  function enviarCodigo(opsId) {
    if (!window.opener || window.opener.closed) {
      mostrarStatus(
        '⚠️ O painel CHECK não foi encontrado. ' +
        'Feche esta janela e abra o scanner pelo botão do painel.'
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
      return;
    }

    try {
      window.opener.postMessage(
        { type: 'QR_SCAN', opsId: opsId },
        APPS_SCRIPT_ORIGIN
      );

      // Não libera nova leitura antes da resposta do painel.
      mostrarStatus(
        '🔎 OPS ID ' + opsId + ' enviado. Aguardando resposta da planilha...'
      );

      // Detecta quando o painel não responde.
      setTimeout(function() {
        if (!aguardandoResposta) return;

        mostrarStatus(
          '⏳ O QR foi lido (' + opsId + '), mas o painel não respondeu. ' +
          'Confira o listener QR_SCAN no Index.html do Apps Script.'
        );

        botaoRetomar.hidden = false;
      }, 15000);

    } catch (erro) {
      console.error('[CHECK] Erro ao enviar ao painel:', erro);

      mostrarStatus(
        '❌ Não foi possível enviar o código ao painel: ' +
        (erro.message || erro)
      );

      aguardandoResposta = false;
      botaoRetomar.hidden = false;
    }
  }

  // Recebe o resultado devolvido pelo painel Apps Script.
  window.addEventListener('message', function(event) {
    if (event.origin !== APPS_SCRIPT_ORIGIN) return;

    const dados = event.data;
    if (!dados || dados.type !== 'SCAN_RESULT') return;

    const r = dados.resultado;

    if (!r || !r.encontrado) {
      limparResultado();

      mostrarStatus(
        '❌ ' + ((r && r.mensagem) || 'OPS ID não encontrado nas abas de turno.')
      );

      aguardandoResposta = false;
      lendo = false;
      botaoRetomar.hidden = false;
      return;
    }

    document.getElementById('nome').textContent =
      r.colaborador || 'Não informado';

    document.getElementById('lider').textContent =
      r.lider || 'Não informado';

    document.getElementById('turno').textContent =
      r.turno || 'Não informado';

    document.getElementById('opsId').textContent =
      r.opsId || ultimoOpsId || '—';

    document.getElementById('aba').textContent =
      r.aba || 'Não informada';

    document.getElementById('registro').textContent =
      r.sucesso ? 'REGISTRADO NA ABA CHECK' :
      r.duplicado ? 'JÁ REGISTRADO HOJE' :
      (r.mensagem || 'CONSULTADO');

    resultadoEl.style.display = 'block';

    if (r.sucesso) {
      mostrarStatus('✅ Colaborador identificado e registrado!');
    } else if (r.duplicado) {
      mostrarStatus('⚠️ Colaborador identificado; já registrado hoje.');
    } else {
      mostrarStatus('✅ Colaborador identificado.');
    }

    aguardandoResposta = false;
    lendo = false;
    botaoRetomar.hidden = false;
  });

  async function iniciarScanner() {
    if (scannerIniciado) return;
    scannerIniciado = true;

    try {
      if (typeof ZXingBrowser === 'undefined') {
        throw new Error('Biblioteca ZXing não carregada. Verifique a internet.');
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error('Câmera indisponível. Abra a página via HTTPS.');
      }

      // Leitor QR específico.
      leitor = new ZXingBrowser.BrowserQRCodeReader();

      mostrarStatus('📷 Solicitando acesso à câmera...');

      controles = await leitor.decodeFromVideoDevice(
        undefined,
        video,
        function(codigo, erro) {
          if (!codigo || !lendo || aguardandoResposta) return;

          const valor = String(codigo.getText() || '').trim();
          if (!valor) return;

          console.log('[CHECK] QR decodificado:', valor);
          aoLerQRCode(valor);
        }
      );

      mostrarStatus(
        '🟢 CÂMERA ATIVA — Aponte o QR Code para dentro da mira.'
      );

    } catch (erro) {
      console.error('[CHECK] Erro ao iniciar leitor:', erro);
      scannerIniciado = false;

      mostrarStatus(
        '❌ Erro ao iniciar leitor: ' + (erro.message || erro)
      );
    }
  }

  function retomarLeitura() {
    limparResultado();

    aguardandoResposta = false;
    lendo = true;
    botaoRetomar.hidden = true;

    mostrarStatus('🟢 Pronto para ler o próximo crachá.');
  }

  window.addEventListener('beforeunload', function() {
    if (controles && typeof controles.stop === 'function') {
      controles.stop();
    }
  });

  iniciarScanner();
</script>
</body>
</html>
