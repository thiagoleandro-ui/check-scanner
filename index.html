<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>CHECK - Scanner de Crachá</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

.topo {
  padding: 25px 15px 10px;
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

p {
  margin: 0;
  color: #d1d5db;
}

#reader {
  width: 100%;
  max-width: 520px;
  min-height: 300px;
  margin: 25px auto;
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
}

#status {
  width: calc(100% - 30px);
  max-width: 520px;
  margin: 20px auto;
  padding: 16px;
  border-radius: 10px;
  background: #1f2937;
  font-weight: bold;
}

.ok {
  background: #166534 !important;
}

.erro {
  background: #991b1b !important;
}

#erroDetalhado {
  width: calc(100% - 30px);
  max-width: 700px;
  margin: 10px auto 30px;
  padding: 12px;
  background: #374151;
  border-radius: 8px;
  color: #fca5a5;
  font-size: 13px;
  word-break: break-word;
  display: none;
}

</style>

</head>

<body>

<div class="topo">

<h1>
📷 CHECK - Scanner de Crachá
</h1>

<p>
Aponte a câmera para o QR Code
</p>

</div>


<div id="reader"></div>


<div id="status">
Iniciando...
</div>


<div id="erroDetalhado"></div>


<script>

const APPS_SCRIPT_ORIGIN =
  'https://script.google.com';

let scanner = null;

let ultimoCodigo = '';

let ultimaLeitura = 0;


/* ============================
   STATUS
============================ */

function mostrarStatus(texto, erro = false) {

  const elemento =
    document.getElementById('status');

  elemento.textContent =
    texto;

  elemento.className =
    erro ? 'erro' : 'ok';

}


/* ============================
   ERRO DETALHADO
============================ */

function mostrarErroDetalhado(erro) {

  const elemento =
    document.getElementById(
      'erroDetalhado'
    );

  elemento.style.display =
    'block';

  elemento.textContent =
    'Detalhes técnicos: ' +
    (
      erro &&
      erro.message
        ? erro.message
        : String(erro)
    );

}


/* ============================
   ENVIAR PARA APPS SCRIPT
============================ */

function enviarParaAppsScript(opsId) {

  if (
    !window.opener ||
    window.opener.closed
  ) {

    mostrarStatus(
      '⚠️ Abra o scanner pelo botão do painel CHECK.',
      true
    );

    return;

  }


  window.opener.postMessage(

    {
      type: 'QR_SCAN',
      opsId: String(opsId).trim()
    },

    APPS_SCRIPT_ORIGIN

  );


  mostrarStatus(
    '✅ QR enviado: ' + opsId
  );

}


/* ============================
   QR ENCONTRADO
============================ */

function onScanSuccess(decodedText) {

  const agora =
    Date.now();


  if (
    decodedText === ultimoCodigo &&
    agora - ultimaLeitura < 3000
  ) {

    return;

  }


  ultimoCodigo =
    decodedText;

  ultimaLeitura =
    agora;


  mostrarStatus(
    '✅ QR Code identificado: ' +
    decodedText
  );


  enviarParaAppsScript(
    decodedText
  );

}


/* ============================
   ERRO DE LEITURA
============================ */

function onScanFailure(errorMessage) {

  // Não mostrar erros de leitura contínuos.
  // É normal enquanto nenhum QR está na frente da câmera.

}


/* ============================
   INICIAR CÂMERA
============================ */

async function iniciarScanner() {

  try {

    mostrarStatus(
      '📷 Solicitando acesso à câmera...'
    );


    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      throw new Error(
        'A biblioteca html5-qrcode não foi carregada.'
      );

    }


    /*
     * Primeiro descobrimos as câmeras.
     */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'O navegador não encontrou nenhuma câmera.'
      );

    }


    console.log(
      'Câmeras encontradas:',
      cameras
    );


    /*
     * Mostra as câmeras encontradas
     * para facilitar o diagnóstico.
     */

    mostrarStatus(
      '📷 Câmera encontrada. Iniciando leitor...'
    );


    /*
     * Usa a primeira câmera disponível.
     */

    const cameraId =
      cameras[0].id;


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 280
        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );


    mostrarStatus(
      '🟢 CÂMERA ATIVA — Aponte para o QR Code.'
    );


  }

  catch (erro) {

    console.error(
      'ERRO AO INICIAR SCANNER:',
      erro
    );


    mostrarStatus(
      '❌ Não foi possível iniciar a câmera.',
      true
    );


    mostrarErroDetalhado(
      erro
    );

  }

}


/* ============================
   INICIAR QUANDO A PÁGINA ABRIR
============================ */

window.addEventListener(
  'load',
  iniciarScanner
);

</script>

</body>

</html>
