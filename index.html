<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CHECK - Scanner de Crachá</title>

 <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 18px 0 5px;
      font-size: 34px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 25px;
    }

    #cameraArea {
      position: relative;
      width: min(700px, 92vw);
      margin: auto;
    }

    #video {
      width: 100%;
      display: block;
      border-radius: 18px;
      background: black;
    }

    .mira {
      position: absolute;

      width: 330px;
      height: 220px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border: 4px solid white;

      border-radius: 8px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.30);
    }

    #status {

      width: min(700px, 92vw);

      margin: 25px auto;

      padding: 18px;

      border-radius: 12px;

      background: #374151;

      font-size: 20px;

      font-weight: bold;
    }

    .sucesso {
      background: #166534 !important;
    }

    .erro {
      background: #991b1b !important;
    }

    .info {
      background: #374151 !important;
    }

    #resultado {

      width: min(700px, 92vw);

      margin: 15px auto;

      padding: 15px;

      border-radius: 10px;

      background: #1f2937;

      font-size: 18px;

      word-break: break-all;

    }

  </style>

</head>


<body>

  <h1>📷 CHECK - Scanner de Crachá</h1>

  <div class="subtitulo">
    Aponte o QR Code ou código de barras do crachá
  </div>


  <div id="cameraArea">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="mira"></div>

  </div>


  <div id="status" class="info">
    🔄 Iniciando leitor...
  </div>


  <div id="resultado">
    Aguardando código...
  </div>


<script>

const APPS_SCRIPT_ORIGIN =
  'https://script.google.com';


const video =
  document.getElementById('video');

const status =
  document.getElementById('status');

const resultado =
  document.getElementById('resultado');


let leitor = null;

let lendo = true;


/* =========================
   STATUS
========================= */

function statusMensagem(
  mensagem,
  tipo = 'info'
) {

  status.textContent = mensagem;

  status.className = '';

  status.classList.add(tipo);

}


/* =========================
   INICIAR LEITOR
========================= */

async function iniciarScanner() {

  try {

    statusMensagem(
      '📷 Procurando câmera...',
      'info'
    );


    leitor =
      new ZXingBrowser.BrowserMultiFormatReader();


    const dispositivos =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    console.log(
      'Câmeras encontradas:',
      dispositivos
    );


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'Nenhuma câmera encontrada.'
      );

    }


    /*
     * Tenta escolher a câmera traseira.
     * Se não existir, usa a primeira.
     */

    let camera =
      dispositivos.find(
        d =>
          /back|rear|environment|traseira/i
            .test(d.label)
      );


    if (!camera) {
      camera = dispositivos[0];
    }


    console.log(
      'Câmera selecionada:',
      camera
    );


    statusMensagem(
      '🟢 CÂMERA ATIVA — Aponte o crachá para o quadrado.',
      'info'
    );


    await leitor.decodeFromVideoDevice(

      camera.deviceId,

      video,

      (resultado, erro) => {


        if (resultado && lendo) {

          const valor =
            resultado.getText();


          console.log(
            '================================'
          );

          console.log(
            'CÓDIGO ENCONTRADO:',
            valor
          );

          console.log(
            '================================'
          );


          processarCodigo(
            valor
          );

        }

      }

    );


  } catch (erro) {

    console.error(
      'ERRO:',
      erro
    );


    statusMensagem(
      '❌ ERRO: ' +
      erro.message,
      'erro'
    );

  }

}


/* =========================
   PROCESSAR CÓDIGO
========================= */

function processarCodigo(valor) {

  if (!lendo) {
    return;
  }


  lendo = false;


  const codigo =
    String(valor).trim();


  resultado.innerHTML =
    '<strong>✅ CÓDIGO ENCONTRADO</strong><br><br>' +
    codigo;


  statusMensagem(
    '🟢 CÓDIGO LIDO COM SUCESSO!',
    'sucesso'
  );


  enviarParaAppsScript(
    codigo
  );

}


/* =========================
   ENVIAR AO APPS SCRIPT
========================= */

function enviarParaAppsScript(
  codigo
) {

  console.log(
    'Enviando para Apps Script:',
    codigo
  );


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: 'QR_SCAN',
        opsId: codigo
      },

      APPS_SCRIPT_ORIGIN

    );


    statusMensagem(
      '✅ Código enviado ao CHECK.',
      'sucesso'
    );


  } else {

    statusMensagem(
      '⚠️ Abra o scanner pelo botão do painel CHECK.',
      'erro'
    );

  }

}


/* =========================
   INICIAR
========================= */

window.addEventListener(
  'load',
  iniciarScanner
);

</script>

</body>

</html>
